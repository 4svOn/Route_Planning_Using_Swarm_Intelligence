<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переключатель с подсветкой</title>
  <style>
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 100px;
      height: 34px;
      border-radius: 34px;
      overflow: hidden;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    .slider .text {
      font-size: 14px;
      color: white;
      transition: 0.4s;
      z-index: 1;
    }
    .slider .text.on {
      opacity: 0;
    }
    .slider .text.off {
      opacity: 1;
    }
    .slider::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #2196F3;
      transition: 0.4s;
      z-index: 0;
    }
    .slider::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background-color: #ccc;
      transition: 0.4s;
      z-index: 0;
    }
    input:checked + .slider::before {
      background-color: #ccc;
    }
    input:checked + .slider::after {
      background-color: #2196F3;
    }
    input:checked + .slider .text.on {
      opacity: 1;
    }
    input:checked + .slider .text.off {
      opacity: 0;
    }
  </style>
</head>
<body>
  <label class="toggle-switch">
    <input type="checkbox" id="toggle-button">
    <span class="slider">
      <span class="text on">Вкл</span>
      <span class="text off">Выкл</span>
    </span>
  </label>

  <script>
    document.getElementById('toggle-button').addEventListener('change', function() {
      if (this.checked) {
        console.log('Переключатель включен');
      } else {
        console.log('Переключатель выключен');
      }
    });
  </script>
</body>
</html>
