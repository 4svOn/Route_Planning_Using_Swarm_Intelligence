<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Image source: https://github.com/openlayers/openlayers -->
  <link rel="icon" type="image/svg+xml" href="https://openlayers.org/theme/img/logo-dark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Planning Using Swarm Intelligence</title>
  <!-- Стили по умолчанию от OpenLayers -->
  <link rel="stylesheet" href="/node_modules/ol/ol.css" />
  <!-- Наши стили: сделаем карту во всю ширину страницы -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Контейнер для карты -->
  <div id="map-container">
    <div id="map"></div>
    <div id="controls">
      <label class="toggle-switch-customer-depot">
        <input type="checkbox" id="toggle-button-customer-depot">
        <span class="slider">
          <span class="text on">Customers</span>
          <span class="text off">Depot</span>
        </span>
      </label>
      <label id="toggle-switch-aco-pso" class="toggle-switch-aco-pso hidden-element">
        <input type="checkbox" id="toggle-button-aco-pso">
        <span class="slider">
          <span class="text on">ACO</span>
          <span class="text off">PSO</span>
        </span>
      </label>
      <div class="controls-button-container">
        <button id="sendRequestBtn" class="controls-button">Process calculations</button>
        <button id="clearRoutesBtn" class="controls-button">Clear routes</button>
      </div>

      <h4 id="route-markers-list-title" class="route-markers-list-title hidden-element list-title">Points on the route:</h4>
      <div id="route-markers-list-container" class="route-markers-list-container hidden-element list-container">
        <ul id="route-markers-list"></ul>
      </div>

      <h4 class="markers-list-title list-title">Added points:</h4>
      <div class="markers-list-container list-container">
        <ul id="markers-list"></ul>
      </div>
    </div>

  <div id="error-message" class="error-message">
    <span id="error-text"></span>
    <span class="close-button" onclick="hideError()">×</span>
  </div>

  <div id="popup" class="popup">
    <span id="popup-total-distance"></span>
  </div>

  <!-- JavaScript код для инициализации карты -->
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/@mapbox/polyline@1.1.1/lib/polyline.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    function hideError() {
      const errorMessage = document.getElementById('error-message');
      errorMessage.classList.remove('show');
    }

    document.querySelectorAll('input[type="text"]').forEach(input => {
      input.addEventListener('input', function() {
        // Удаляем все символы, кроме цифр
        this.value = this.value.replace(/[^0-9]/g, '');
      });
    });
  </script>

  <!-- <script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.min.js"></script> -->

</body>
</html>
